name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome:
    name: Lint and format (Biome)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # バージョンは lockfile から読まれる。
      - uses: biomejs/setup-biome@v2
      - run: biome ci .

  typecheck-build:
    name: Typecheck and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  generated:
    name: Generated files are up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      - run: pnpm db:generate
      - name: Fail if generated files changed
        run: |
          if [ -n "$(git status --porcelain -- packages/api-client apps/api/drizzle)" ]; then
            git status --porcelain -- packages/api-client apps/api/drizzle
            echo "::error::Run 'pnpm gen' and 'pnpm db:generate', then commit the result."
            exit 1
          fi
