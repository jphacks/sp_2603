name: CI

on:
  pull_request:
    # 本文やタイトルに !ignore を足したり消したりしたときも判定し直す。
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # main には必須チェックがあるので、paths-ignore でワークフローごと止めるとマージできなくなる。
  # ここで判定し、ほかのジョブを if でスキップする (スキップしたジョブは必須チェックを満たす)。
  # 判定が失敗したときは skip が空になり、ほかのジョブはすべて実行される。
  changes:
    name: Decide whether to run CI
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HAS_IGNORE: ${{ contains(github.event.pull_request.title, '!ignore') || contains(github.event.pull_request.body, '!ignore') }}
        run: |
          # main への push はデプロイの前なので、いつもすべて実行する。
          if [ "$IS_PULL_REQUEST" != "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_IGNORE" = "true" ]; then
            echo "PR のタイトルか本文に !ignore があるので CI をスキップする"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq ".[].filename")
            if grep -qvE "^docs/|\.md$" <<< "$files"; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "docs/ と Markdown だけの変更なので CI をスキップする"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  biome:
    name: Lint and format (Biome)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # バージョンは lockfile から読まれる。
      - uses: biomejs/setup-biome@v2
      - run: biome ci .

  typecheck-build:
    name: Typecheck and build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck

  test:
    name: Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  generated:
    name: Generated files are up to date
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      - run: pnpm db:generate
      - name: Fail if generated files changed
        run: |
          if [ -n "$(git status --porcelain -- packages/api-client apps/api/drizzle)" ]; then
            git status --porcelain -- packages/api-client apps/api/drizzle
            echo "::error::Run 'pnpm gen' and 'pnpm db:generate', then commit the result."
            exit 1
          fi
